<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <rect width="1280" height="640" fill="#101418"/>
  <!-- motif: a session bar that pauses mid-way, then forks into "continue" vs "decline" -->
  <g stroke="#e8a87c" stroke-width="6" fill="none" stroke-linecap="round">
    <line x1="720" y1="470" x2="930" y2="470"/>
    <line x1="960" y1="450" x2="960" y2="490" stroke-width="8"/>
    <line x1="980" y1="450" x2="980" y2="490" stroke-width="8"/>
    <path d="M1005 470 C1060 470 1080 400 1170 400"/>
    <path d="M1005 470 C1060 470 1080 540 1170 540" stroke-dasharray="10 12" opacity="0.5"/>
  </g>
  <circle cx="720" cy="470" r="12" fill="#e8a87c"/>
  <circle cx="1170" cy="400" r="12" fill="#e8a87c"/>
  <circle cx="1170" cy="540" r="12" fill="none" stroke="#e8a87c" stroke-width="4" opacity="0.5"/>
  <text x="80" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="76" font-weight="800" fill="#f4f1ec">The Free Massage</text>
  <text x="80" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="76" font-weight="800" fill="#f4f1ec">Pause-and-Upsell</text>
  <rect x="80" y="330" width="120" height="8" fill="#e8a87c"/>
  <text x="80" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="32" fill="#b8b2a8">Case study · the psychology of "want me to continue?"</text>
</svg>
